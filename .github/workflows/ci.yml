# CI stub. Runs the same harness as scripts/verify-all.sh.
# Action versions are pinned by tag for now. Pinning every action by commit SHA is an M8 acceptance test
# (`CI: every action reference is pinned by a 40-char SHA`, docs/ROADMAP.md M8).
# No secret is referenced anywhere in this file: it runs on pull requests. Developer ID signing, notarization and
# Sparkle signing live in release-mac.yml, in the protected `release` environment (docs/DEPLOYMENT.md section 13).
# Note: workflow files could not be pushed to the old repo because the gh token there lacks the `workflow` scope,
# so the old macOS CI build (PR #41 mac-release.yml, PR #45 builder-mac.yml.proposed) is blocked. Re-auth is operator
# item O4 in docs/ROADMAP.md.
name: ci
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core:
    name: core (bun, typecheck, tests, license boundary)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Real Postgres 17 + pgvector: RLS, roles, partitions and the durable runtime are tested here, not on PGlite.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: offload
          POSTGRES_PASSWORD: offload-ci
          POSTGRES_DB: offload_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U offload -d offload_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI-only throwaway database on the job's service container. Not a secret.
      DATABASE_URL: postgres://offload:offload-ci@localhost:5432/offload_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit -p tsconfig.json
      - run: bun test
      - run: bash scripts/check-license-boundary.sh
      - run: bash scripts/check-slices.sh
      - run: bun scripts/check-doc-links.ts
      - run: bash scripts/check-copy.sh
      - run: bash scripts/check-secrets-hygiene.sh
      - run: bun scripts/check-workflows.ts
  changes:
    # Path filter for the mac job (hosted macOS minutes cost about ten times Linux minutes, DEPLOYMENT 6.1):
    # apps/mac, packages/contracts (generated Swift types) and the workflow files. No third-party action needed.
    name: changes (does the mac job need to run)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.filter.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="$PR_BASE"; else base="$PUSH_BEFORE"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "mac=true" >> "$GITHUB_OUTPUT"; echo "no base commit: mac job runs"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(apps/mac/|packages/contracts/|\.github/workflows/)'; then
            echo "mac=true" >> "$GITHUB_OUTPUT"; echo "mac paths changed: mac job runs"
          else
            echo "mac=false" >> "$GITHUB_OUTPUT"; echo "no mac paths changed: mac job skipped"
          fi
  mac:
    # Job shape ported from the old repo's ci/mac-release-workflow branch (docs/DEPLOYMENT.md section 6.2,
    # docs/MIGRATION.md section 5.2), written fresh. macos-26 matches the runner PR #41 built the old app on.
    # CI capacity for macOS is OQ-25 / operator item O12. PR CI signs ad hoc; Developer ID signing is release-mac.yml.
    name: mac (build, bundle, ad hoc sign, smoke test, swift test, Swift slices)
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    timeout-minutes: 150
    env:
      TZ: UTC
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: select toolchain and print it
        # Select the image's newest Xcode, not Command Line Tools: Swift Testing (`import Testing`) ships with Xcode
        # and is not reliably present in CLT, so `swift test` failed with "no such module 'Testing'" under CLT.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          xcode-select -p
          xcodebuild -version
          swiftc --version
          xcrun --show-sdk-version
          sw_vers
          uname -m
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: swift build
        working-directory: apps/mac
        timeout-minutes: 30
        run: swift build -c release
      - name: bundle app
        # Release flavour (ai.offload.mac). The feed keys are written only when both public repository variables
        # exist (operator items O11, O13); otherwise the app reports "updates off in this build".
        env:
          OFFLOAD_VERSION: 0.0.0
          OFFLOAD_BUILD_NUMBER: ${{ github.run_number }}
          OFFLOAD_DOWNLOADS_HOST: ${{ vars.OFFLOAD_DOWNLOADS_HOST }}
          SPARKLE_ED_PUBLIC_KEY: ${{ vars.SPARKLE_ED_PUBLIC_KEY }}
        run: bash apps/mac/Packaging/bundle.sh release
      - name: sign ad hoc
        run: bash apps/mac/Packaging/sign.sh apps/mac/.build/bundle/Offload.app adhoc
      - name: developer id signing
        run: |
          echo "developer id signing: runs in release-mac.yml"
      - name: check bundle
        run: bash apps/mac/Packaging/check-bundle.sh apps/mac/.build/bundle/Offload.app
      - name: zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent apps/mac/.build/bundle/Offload.app \
            "apps/mac/.build/bundle/Offload-mac-${GITHUB_SHA}.zip"
      - name: upload build before tests
        # A red test never hides a build you can install.
        uses: actions/upload-artifact@v4
        with:
          name: Offload-mac-${{ github.sha }}
          path: apps/mac/.build/bundle/Offload-mac-${{ github.sha }}.zip
          if-no-files-found: error
      - name: installed-copy smoke test
        id: smoke
        # From a ditto copy outside the repo, with an empty environment: self-check mode starts capture against a
        # fake permission source, writes nothing outside the temp HOME and exits 0.
        timeout-minutes: 5
        continue-on-error: true
        run: |
          tmp="$(mktemp -d)"
          mkdir "$tmp/home"
          ditto apps/mac/.build/bundle/Offload.app "$tmp/Offload.app"
          env -i HOME="$tmp/home" PATH=/usr/bin:/bin:/usr/sbin:/sbin "$tmp/Offload.app/Contents/MacOS/Offload" --self-check
      - name: swift test
        id: swift_test
        working-directory: apps/mac
        timeout-minutes: 30
        continue-on-error: true
        run: swift test
      - name: Swift slice m3-02-mac-capture-upload
        id: slice_m302
        # Runs once the slice is marked done (red tests exist by design before that, as in check-slices.sh).
        # REQUIRE_MAC=1 turns a "needs macOS" skip into a failure.
        timeout-minutes: 45
        continue-on-error: true
        env:
          REQUIRE_MAC: "1"
        run: |
          if grep -q '^status: done' slices/m3-02-mac-capture-upload/SPEC.md; then
            bash slices/m3-02-mac-capture-upload/verify.sh
          else
            echo "m3-02-mac-capture-upload: not done yet, verify not run"
          fi
      - name: Swift slice m3-03-mac-signing-sparkle
        id: slice_m303
        timeout-minutes: 25
        continue-on-error: true
        env:
          REQUIRE_MAC: "1"
          SKIP_FULL_SUITE: "1"
        run: |
          if grep -q '^status: done' slices/m3-03-mac-signing-sparkle/SPEC.md; then
            bash slices/m3-03-mac-signing-sparkle/verify.sh
          else
            echo "m3-03-mac-signing-sparkle: not done yet, verify not run"
          fi
      - name: result
        if: always()
        run: |
          echo "smoke test: ${{ steps.smoke.outcome }}"
          echo "swift test: ${{ steps.swift_test.outcome }}"
          echo "slice m3-02: ${{ steps.slice_m302.outcome }}"
          echo "slice m3-03: ${{ steps.slice_m303.outcome }}"
          test "${{ steps.smoke.outcome }}" = success
          test "${{ steps.swift_test.outcome }}" = success
          test "${{ steps.slice_m302.outcome }}" = success
          test "${{ steps.slice_m303.outcome }}" = success
